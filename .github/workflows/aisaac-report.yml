name: AIsaac Coms Report

# Polls every repo in backend/app/github_registry.py via the GitHub API and
# pushes a status report to this app's own /internal/ci-report. The scheduled
# time is 15:15 UTC; GitHub Actions may delay scheduled runs.
on:
  schedule:
    - cron: "15 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: aisaac-status-report
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install backend package
        run: python -m pip install -e .

      - name: Report CI/PR/issue status to AIsaac Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.REPORT_GITHUB_TOKEN }}
          INTERNAL_REPORT_SECRET: ${{ secrets.INTERNAL_REPORT_SECRET }}
          AISAAC_DASHBOARD_URL: ${{ vars.AISAAC_DASHBOARD_URL || 'https://aisaac-dashboard.fly.dev' }}
        run: python scripts/report_ci_status.py
