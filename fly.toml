app = "aisaac-dashboard"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "aisaac_data"
  destination = "/data"
  initial_size = "1gb"

[env]
  PROFILE = "production"
  # Health states should settle after a cold start but must not look disconnected
  # for hours after an endpoint or provider recovers.
  CACHE_TTL_SECONDS = "300"
  INCIDENTS_DB_PATH = "/data/aisaac_incidents.db"
  CI_EVENTS_DB_PATH = "/data/aisaac_ci_events.db"
  SECOND_BRAIN_DB_PATH = "/data/aisaac_second_brain.db"
  HEALTH_DB_PATH = "/data/aisaac_health.db"
  METRICS_DB_PATH = "/data/aisaac_metrics.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
